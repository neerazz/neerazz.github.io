title: '## My Story'
content: >
  #### My journey in tech began with a simple question: "How can this be better?" It's a question that has taken me from writing COBOL adapters for American Express across three continents to architecting Zero Trust security infrastructure for embedded lending at scale.


  Today at Parafin, I work on security infrastructure for a platform that has extended $35B+ in capital offers to 50,000+ businesses across partners including Amazon, DoorDash, Walmart, Gusto, and TikTok Shop. I've been named a **Gold Laureate** in the Aureum Technology Awards (Season 3, NLP Achievement) and elected **Fellow** of Hackathon Raptors. I've published four peer-reviewed AI-security papers in 2026 (EmbedGuard, GenOps, RuntimeGuard-AI, TriArchitect), released the PerceptFence Zenodo/GitHub research artifact, spoken at Conf42 DevOps, Conf42 LLMs, and CIMA 2026, and earned Fellowship in IICSPA and Full Membership in Sigma Xi — The Scientific Research Honor Society.


  I thrive on turning complex distributed systems into reliable (and slightly boring) platforms. My goal is to automate the pain points away and build security so seamless you forget it's there. Whether I'm sketching system diagrams, mentoring engineers, or debugging a gnarly distributed trace at 2am, I'm always searching for the next puzzle to solve.

