title: '## My Story'
content: >
  #### My journey in tech began with a simple question: "How can this be better?" It's a question that has taken me from writing COBOL adapters for American Express across three continents to architecting Zero Trust security infrastructure for one of fintech's fastest-growing platforms.


  Today at Parafin, I protect an $8B+ embedded lending platform that powers capital access for businesses on Amazon, DoorDash, Walmart, and TikTok Shop. I've been named a **Gold Laureate** in the Aureum Technology Awards (Season 3, NLP Achievement) and elected **Fellow** of Hackathon Raptors (peer-elected UK fellowship). I've published research in AI security (EmbedGuard, under review at PeerJ Computer Science), spoken at Conf42 DevOps 2026, and earned Fellowship in IICSPA and Full Membership in Sigma Xi — The Scientific Research Honor Society.


  I thrive on turning complex distributed systems into reliable (and slightly boring) platforms. My goal is to automate the pain points away and build security so seamless you forget it's there. Whether I'm sketching system diagrams, mentoring engineers, or debugging a gnarly distributed trace at 2am, I'm always searching for the next puzzle to solve.

