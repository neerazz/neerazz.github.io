title: >
  ## About me

  When I’m not coding or diagramming rectangles and arrows, I’m probably refactoring my home lab or explaining blockchain to my 5-year-old (not recommended).

content: >
  My journey in tech started with a simple curiosity: how do things work, and how can I make them better? Over the years, that curiosity has taken me from tinkering with home labs to leading the charge on build infrastructure for AR/VR at Meta.

  Along the way, I’ve helped Wayfair level up its security posture, built a crypto trading platform that actually moves real money, and learned that the best systems are the ones you don’t have to think about—they just work.

  What drives me is making complex systems reliable (and, honestly, a little boring), finding ways to automate away developer pain, and helping engineers grow into leaders. Whether I’m diagramming rectangles and arrows or explaining blockchain to my 5-year-old (not recommended), I’m always looking for the next challenge to simplify.

