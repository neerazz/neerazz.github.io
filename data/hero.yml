content: >
  ## I build security that's invisible and infrastructure that's boring.

  Currently architecting Zero Trust security at Parafin — supporting an embedded-lending platform with $35B+ in capital offers extended to 50,000+ businesses. **Gold Laureate**, Aureum Technology Awards (Season 3, NLP Achievement). **Fellow**, Hackathon Raptors. Published AI security researcher — four peer-reviewed papers in 2026 (EmbedGuard, GenOps, RuntimeGuard-AI, TriArchitect), plus the PerceptFence DOI-backed research artifact. Speaker at Conf42 DevOps 2026, Conf42 LLMs 2026, and CIMA 2026. Fellow of IICSPA. Building mission-critical systems since 2011 across Parafin, Meta, Wayfair, JPMorgan Chase, and American Express.
