topTitle: Hi, I'm Neeraj Kumar Singh Beshane
content: >
  ## Staff Security Infrastructure Engineer · AI agent security, Zero Trust, cloud security

  I build security that's invisible and infrastructure that's boring. First security engineer at Parafin, which has funded $3B+ to 60,000+ small businesses and is joining Stripe. Published AI-security researcher — four peer-reviewed papers in 2026 (EmbedGuard, GenOps, RuntimeGuard-AI, TriArchitect) and two arXiv preprints (PerceptFence, The Acknowledgment Point Is the System). Speaker at Conf42 DevOps 2026, Conf42 LLMs 2026, and CIMA 2026. **Full Member**, Sigma Xi. **Fellow**, IICSPA and Hackathon Raptors. Building mission-critical systems since 2011 across Parafin, Meta, Wayfair, JPMorgan Chase, and American Express.
