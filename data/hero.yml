topTitle: Hi, I'm Neeraj Kumar Singh Beshane
content: >
  ## Making AI agents safe to trust with real permissions.

  Staff Security Engineer working on AI-agent security, Zero Trust, and cloud security. I write the weekly *Securing the Agentic Stack* newsletter and have published four peer-reviewed AI-security papers. I build security that's invisible and infrastructure that's boring — today as the first security engineer at Parafin, which has funded $3B+ to 60,000+ small businesses and is joining Stripe. Papers: EmbedGuard, GenOps, RuntimeGuard-AI, and TriArchitect (2026), plus two arXiv preprints (PerceptFence, The Acknowledgment Point Is the System). Speaker at Conf42 DevOps 2026, Conf42 LLMs 2026, and CIMA 2026. **Full Member**, Sigma Xi. **Fellow**, IICSPA and Hackathon Raptors. Building mission-critical systems since 2011 across Parafin, Meta, Wayfair, JPMorgan Chase, and American Express.
