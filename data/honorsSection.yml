content: |
  #### International awards

  **Gold Laureate** — [Aureum Technology Awards](https://aureumawards.com/) Season 3 (**NLP Achievement Award**; reference **TEC-26-12296**), [Aureum International Awards Council](https://aureumawards.com/). Season 3: **4,067** applications received, **1,082** advanced to full assessment, **213** laureates after multi-phase expert evaluation (per program materials and press). Media: [Markets Insider — Season 3 results](https://markets.businessinsider.com/news/stocks/aureum-technology-awards-season-3-results-announced-reinforcing-merit-based-global-technology-recognition-and-industry-trust1-1035845335).


  #### Scholarly & research publications

  * **EmbedGuard** — *Cross-Layer Detection and Cryptographic Attestation for Secure Retrieval-Augmented Generation* — under peer review, [PeerJ Computer Science](https://peerj.com/) (Cryptography, Security and Privacy). Preprint & artifacts: [Zenodo DOI 10.5281/zenodo.18364920](https://zenodo.org/records/18364920) · [Implementation (GitHub)](https://github.com/neerazz/embedguard) · [Manuscript portal](https://peerj.com/manuscripts/131685/).

  * **Work in progress** — GenOps (governance for enterprise AI in CI/CD); TriArchitect (multi-agent safe migration); RuntimeGuard AI (runtime verification for autonomous agents).


  #### Technical writing & community reach

  **18+** articles on [LinkedIn](https://www.linkedin.com/in/neerajkumarsinghb/recent-activity/articles/), [Medium](https://medium.com/@neerazz), and Hashnode — distributed systems, Kubernetes, Kafka, Spring Boot, RAG pipelines, databases, and AI security. Representative titles include *From 50 Million Events to a Single Answer: Building a RAG Pipeline in Spring Boot* (2025) and *Prompt Engineering vs Context Engineering vs Reasoning Engineering* (2026).


  #### Speaking

  * **Conf42 LLMs 2026** — invited talk: *RuntimeGuard-AI: Cryptographic Compliance for High-Risk AI Pipelines* — [recording (YouTube)](https://youtu.be/EelEvPhQLDk) · [verified speaker certificate](https://certified.fyi/c/D6lQuWMq-byYEePKD-ZqnMXTeJ-HI8GdZj7).

  * **Conf42 DevOps 2026** — invited talk: *GenOps: A Governance-Driven Model for Safe, High-Velocity AI in CI/CD Pipelines* — [session page](https://www.conf42.com/DevOps_2026_Neeraj_Kumar_Singh_Beshane_governance_genai_velocity) · [recording (YouTube)](https://www.youtube.com/watch?v=YcGxfYXwUvI).


