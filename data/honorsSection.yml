topTitle: Recognition
title: "## Awards & memberships"
content: >
  #### International awards

  **Gold Laureate** — [Aureum Technology Awards](https://aureumawards.com/) Season 3 (NLP Achievement Award; ref. TEC-26-12296), organized by the Aureum International Awards Council. Season 3 drew 4,067 global applications with 213 laureates recognized after multi-phase expert evaluation. Coverage includes a [Markets Insider](https://markets.businessinsider.com/news/stocks/aureum-technology-awards-season-3-results-announced-reinforcing-merit-based-global-technology-recognition-and-industry-trust1-1035845335) results announcement.


  #### Fellowships & professional societies

  * **Fellow**, Hackathon Raptors (UK Community Interest Company #15557917) — peer-elected fellowship for sustained builder and hackathon achievement (Fellow #14975).

  * **Fellow**, International Institute of Certified and Specialized Professionals and Academics (IICSPA).

  * **Full Member**, Sigma Xi — The Scientific Research Honor Society.

  * **Member**, IEEE.
