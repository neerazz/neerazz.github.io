experience:
  - content: >
      ### Parafin (Dec 2025–Present) — Staff Security Infrastructure Engineer

      First security engineer at Parafin, which has funded $3B+ to 60,000+ small businesses and is joining Stripe. Built the vulnerability-management program from zero (policy, asset tiering, priority matrix, SLA engine). Ran the SOC 2 Type II 2026 program end to end (12 workstreams, 86 controls). Took BC/DR from expired to exercised with a live single-AZ production failover and zero customer impact. Set the org-wide AWS security baseline (tamper-proof CloudTrail with 7-year Object Lock, Security Hub, root MFA) and led the company's first production TLS 1.3 migration. Designed OIDC + PKCE single sign-on for partner integrations and an identity/authorization map across four identity planes. Leads AI governance and MCP tool-access security, built a multi-agent design-review framework used on real ERDs, and is DRI for the annual third-party penetration test and the vendor security review program.
    time: Dec 2025–Present
  - content: >
      ### Meta — Reality Labs (Jun 2024–Dec 2025) — Staff Software Engineer

      Build and software supply-chain infrastructure for Quest headsets and Ray-Ban Meta glasses. Tech lead for the Reality Labs CI/CD modernization: 200+ services onboarded through automated migrations with zero production incidents, P50 build time cut 35% and P95 cut 42%. Built the Unified Build Model metadata service, the source of truth for AR/VR build artifacts: 450M+ requests/day and 99% fewer build-tracking failures. Caching and trigger optimization reclaimed 22,000+ compute-hours a month. Built a GenAI migration assistant that removed 95% of manual migration effort. Mentored 6 senior engineers, 3 of whom were promoted to Staff within 12 months.
    time: Jun 2024–Dec 2025
  - content: >
      ### Raymond James (Apr 2024–Jun 2024) — Lead Software Development Engineer

      Led a team of 8 engineers on the document-generation and digital-signature platform behind client onboarding across wealth management and corporate banking: Spring Boot microservices for PDF generation, e-signature integration and workflow orchestration, scaled on Docker and Kubernetes on AWS.
    time: Apr 2024–Jun 2024
  - content: >
      ### Wayfair (Jan 2022–Mar 2024) — Technical Architect

      Security Development team. Built the DevSecOps platform adopted by all 15 Wayfair business units as the company-wide security standard: 50M+ security checks a month and a Kubernetes policy-as-code engine at a 3% false-positive rate. Architected Wayfair's first unified OAuth 2.0 identity service: 125M+ API calls a week at 99.97% uptime. Cut security incident response time 40%. Mentored 20+ engineers (8 promoted to senior/staff).
    time: Jan 2022–Mar 2024
  - content: >
      ### JPMorgan Chase — CIB (Mar 2019–Dec 2021) — Senior Software Engineer

      Electronic Specialty Accounts Portal (ESAP), Corporate & Investment Bank: the client-facing portal JPMorgan escrow clients use to open accounts, transfer funds and issue checks. Joined the team through Mphasis in March 2019 and became a JPMorgan employee in July 2021; by the end I was the portal's core platform and security lead.
    time: Mar 2019–Dec 2021
  - content: >
      ### American Express — via TCS (Dec 2011–Mar 2019) — Senior Software Developer

      Tata Consultancy Services consultant on American Express systems. Re-architected the monolithic International Insurance Services claims application into 5 Java 8 / Spring Boot 2.0 microservices; earlier supported Card Processing on IMS/DB2 mainframes and migrated International Membership Rewards logic from COBOL to Java across 30 markets. Worked in Bangalore, Montevideo (Uruguay) and Phoenix.
    time: Dec 2011–Mar 2019

