      ### Parafin (Dec 2025–Present) — Staff Security Infrastructure Engineer

      First security engineer at Parafin, which has funded $3B+ to 60,000+ small businesses and is joining Stripe. Built the vulnerability-management program from zero (policy, asset tiering, priority matrix, SLA engine). Ran the SOC 2 Type II 2026 program end to end (12 workstreams, 86 controls). Took BC/DR from expired to exercised with a live single-AZ production failover and zero customer impact. Set the org-wide AWS security baseline (tamper-proof CloudTrail with 7-year Object Lock, Security Hub, root MFA) and led the company's first production TLS 1.3 migration. Designed OIDC + PKCE single sign-on for partner integrations and an identity/authorization map across four identity planes. Leads AI governance and MCP tool-access security, built a multi-agent design-review framework used on real ERDs, and is DRI for the annual third-party penetration test and the vendor security review program.
    time: Dec 2025–Present
  - content: >
