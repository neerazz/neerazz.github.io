{{ with .Site.Data.honorsSection }}
{{ if .enable }}
<section class="section about" id="honors">
    <div class="container">
        <div class="row text-center">
            <div class="col-lg-8 offset-lg-2">
                <div class="about_header mb-5">
                    <span class="top-title">{{ .topTitle }}</span>
                    {{ .title | markdownify }}
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-8 offset-lg-2">
                <div class="mb-4 text-light text-left">
                    {{ .content | markdownify }}
                </div>
            </div>
        </div>
    </div>
</section>
{{ end }}
{{ end }}
